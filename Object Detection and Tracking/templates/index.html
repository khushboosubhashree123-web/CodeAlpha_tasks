<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Object Detection & Tracking</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-bottom: 5px; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #00b4d8;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #0096c7; transform: translateY(-3px); }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            border: 5px solid #00b4d8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        #output { width: 100%; display: block; }
        .status {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕵️ Real-Time Object Detection & Tracking</h1>
        <p style="text-align:center; opacity:0.9;">YOLOv8 + Flask + OpenCV</p>

        <div class="controls">
            <button onclick="startStream()">📹 Start Webcam</button>
            <button onclick="stopStream()">⏹ Stop</button>
            <button onclick="toggleTracking()">🔄 Toggle Tracking</button>
        </div>

        <div id="video-container">
            <img id="output" src="" alt="Live Stream">
        </div>

        <div class="status" id="status">Click "Start Webcam" to begin detection</div>
    </div>

    <script>
        let isTracking = true;

        function startStream() {
            document.getElementById('status').textContent = '✅ Stream Started - Detecting Objects...';
            const img = document.getElementById('output');
            img.src = `/video_feed?tracking=${isTracking}`;
        }

        function stopStream() {
            document.getElementById('output').src = '';
            document.getElementById('status').textContent = 'Stream Stopped';
        }

        function toggleTracking() {
            isTracking = !isTracking;
            const img = document.getElementById('output');
            if (img.src.includes('/video_feed')) {
                stopStream();
                setTimeout(startStream, 500);
            }
            alert(`Tracking ${isTracking ? 'ENABLED' : 'DISABLED'}`);
        }
    </script>
</body>
</html>
